name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploying needs permission to create a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Quality gates · Static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Quality gates mirror ci.yml. A push to main triggers both workflows
      # in parallel, so the deploy must run its own gates rather than assume CI.
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx}"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit:ci

      - name: Resolve Pages base path
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Project pages (owner.github.io/<repo>) need the repo prefix baked
          # into asset URLs; custom domains and root sites serve at "/".
          # Undetermined (Pages not enabled yet) defaults to the project form.
          HTML_URL=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url // ""' 2>/dev/null || true)
          REPO_URL="${{ github.server_url }}/${{ github.repository }}/"
          if [ -z "$HTML_URL" ] || [ "$HTML_URL" = "$REPO_URL" ]; then
            echo "base_path=/${{ github.event.repository.name }}" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          # Next bakes asset URLs into the HTML at build time. App-level
          # absolute URLs infer the base path at runtime instead — see
          # client/src/lib/basePath.ts.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Enable Pages on the repo automatically if not yet configured.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/out

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
