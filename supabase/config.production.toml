# ====================================================================
# PRODUCTION config profile
# ====================================================================
# Used after `supabase link --project-ref <ref>` to manage the hosted
# project (migrations, types, edge functions). Local-only services are
# disabled because they do not run in production. Replace the placeholder
# URLs/`project_id` with your real production values.
#
# NOTE: the CLI auto-reads `supabase/config.toml`. To use THIS file, pass
# it explicitly, e.g.:
#   supabase link --project-ref <ref> --config-path supabase/config.production.toml
#   supabase db push --config-path supabase/config.production.toml
# ====================================================================

project_id = "donate-prod"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# Never auto-seed a production database.
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = false
port = 54323
api_url = "https://your-project-ref.supabase.co"

[inbucket]
enabled = false
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Production site + redirect URLs (replace with real domain).
site_url = "https://donate.example.com"
additional_redirect_urls = ["https://donate.example.com"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
