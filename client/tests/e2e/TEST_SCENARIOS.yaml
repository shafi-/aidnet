# =====================================================================
# E2E TEST SCENARIO CATALOGUE — donate client
# =====================================================================
# Machine-readable inventory of every e2e scenario in tests/e2e/.
# Source of truth for WHAT is covered; the specs remain the source of
# truth for HOW. Keep in sync when adding/removing tests.
#
# Conventions (see tests/test-creation-guideline.md):
#   actor:  anon | orgOwner | orgMember | systemAdmin | newUser
#   type:   ui      - browser journey against the static export
#           api     - direct RPC/auth contract (no UI)
#           api+ui  - UI journey with a paired API-contract assertion
#   setup:  seeded  - relies only on seed-auth.sh data
#           fresh   - registers its own users/orgs per run
#   serial: tests share state and must run in order
# =====================================================================

meta:
  suite: client/tests/e2e
  runner: playwright
  projects: [setup, chromium, firefox, webkit, Mobile Chrome, Mobile Safari]
  mobile_scope: responsive.spec.ts only
  workers: 1
  seed:
    script: supabase/seed-auth.sh
    users:
      - { email: admin@donate.app, password: Password123!, role: systemAdmin }
      - {
          email: owner@donate.app,
          password: Password123!,
          role: orgOwner,
          org: demo-org,
        }
      - {
          email: member@donate.app,
          password: Password123!,
          role: orgMember,
          org: demo-org,
        }
      - {
          email: individual@donate.app,
          password: Password123!,
          role: individual,
          org: null,
        }
    data:
      - 14 live demo campaigns (demo-campaign-1..14, one zakat-eligible)
      - draft campaign demo-draft-tagged with tags [education, health]
      - active Pro subscription on demo-org
      - donation methods for demo-org

